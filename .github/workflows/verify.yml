# CI for Daily Nonsense: the same gate as the local pre-commit hook plus the full build.
# Pushes to master also deploy on Vercel (git-linked since Session 9). This workflow doesn't
# deploy anything; it makes a red build visible on the commit and on every pull request.
name: verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # lint + typecheck + unit tests + production build (next/font fetches Google Fonts here)
      - run: npm run verify
